# Deploys the already-built CMSMailbox binaries on the qa branch to qacmsmailbox.
# Replaces Deployment Center's "App Service Build Service" GitHub sync, which kept
# failing with 403 when Azure fetched from GitHub. Here GitHub pushes to Azure instead.
# Needs repo secret AZURE_WEBAPP_PUBLISH_PROFILE_QA (qacmsmailbox's publish profile).
name: Deploy qa to qacmsmailbox

on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ship only the binaries, not git metadata or this workflow.
      - name: Stage files
        run: |
          mkdir "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='.github' ./ "$RUNNER_TEMP/site/"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: qacmsmailbox
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          package: ${{ runner.temp }}/site
